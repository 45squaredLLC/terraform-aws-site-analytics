name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform ${{ matrix.terraform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and current.
        terraform: ["1.9.8", "latest"]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -recursive -check -diff

      - name: Validate module
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Module tests (mocked providers, no AWS calls)
        run: terraform test

      - name: Validate examples
        run: |
          for dir in examples/*/; do
            echo "==> $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  python:
    name: Ingest Lambda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests -q

      - name: Lint
        run: |
          pipx install ruff
          ruff check lambda tests
          ruff format --check lambda tests

  collector:
    name: Collector script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests
        run: node --test tests/collector.test.js
